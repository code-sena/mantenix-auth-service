spring.application.name=auth-service

# Port: see ADR-002 (auth-service = 8081)
server.port=${SERVER_PORT:8081}

# Database: own database per service (ADR-004)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5431/mantenix_auth}
spring.datasource.username=${DB_USERNAME:mantenix}
spring.datasource.password=${DB_PASSWORD:mantenix}

# Hibernate only validates the schema; Flyway creates and changes it (ADR-004)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway migrations: src/main/resources/db/migration
spring.flyway.enabled=true

# Swagger UI: http://localhost:8081/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Health check: http://localhost:8081/actuator/health
management.endpoints.web.exposure.include=health,info

# API messages always in English (ADR-001), regardless of the machine language
spring.web.locale=en
spring.web.locale-resolver=fixed

# bcrypt cost factor (security policy: 12 or more)
app.auth.bcrypt-strength=${APP_AUTH_BCRYPT_ROUNDS:12}
